<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Для Дариночки</title>
<style>
  :root { --pink:#ff4d8d; --pink2:#ff8fb8; --bg1:#ffe3ef; --bg2:#ffc2d9; --ink:#4a1d33; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body { margin:0; height:100%; }
  body { font-family: "Segoe UI", system-ui, sans-serif; color:var(--ink);
    background: linear-gradient(160deg,var(--bg1),var(--bg2)); overflow-x:hidden; }
  .screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center;
    justify-content:center; justify-content:safe center; padding:20px 16px; text-align:center; overflow-y:auto; overflow-x:hidden; }
  .screen.active { display:flex; animation: fade .5s ease; }
  @keyframes fade { from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none} }
  h1 { font-size: clamp(28px, 7vw, 44px); margin:0 0 24px; }
  h2 { font-size: clamp(22px, 5.5vw, 32px); margin:0 0 16px; }
  .big-emoji { font-size: 84px; line-height:1; margin-bottom:12px; }
  button { font: inherit; cursor:pointer; border:0; border-radius:999px; transition: all .3s ease; }
  .btn { background:var(--pink); color:#fff; padding:14px 34px; font-size:20px; font-weight:600;
    box-shadow:0 6px 18px rgba(255,77,141,.4); }
  .btn:active { transform:scale(.96); }
  .btn.ghost { background:#fff; color:var(--pink); box-shadow:0 4px 12px rgba(0,0,0,.1); }
  .btn:disabled { opacity:.4; box-shadow:none; }

  /* screen 1 */
  #answers { display:flex; align-items:center; justify-content:center; gap:16px; min-height:140px; }
  #yes { font-size:22px; }
  #no { background:#fff; color:#777; padding:12px 26px; font-size:18px; box-shadow:0 4px 12px rgba(0,0,0,.12); }
  #no.gone { display:none; }
  #reaction { min-height:110px; margin-top:20px; }
  #reaction .emo { font-size:56px; }
  #reaction .txt { font-size:24px; font-weight:600; }
  #yes.cover { position:fixed; inset:0; z-index:50; border-radius:0; font-size:12vw; margin:0 !important; width:100%; height:100%; }

  /* choices */
  .tabs { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:20px; }
  .tab { background:#fff; color:var(--ink); padding:12px 20px; font-size:18px; box-shadow:0 3px 10px rgba(0,0,0,.1); }
  .tab.on { background:var(--pink); color:#fff; }
  .items { display:flex; flex-direction:column; gap:10px; width:100%; max-width:420px; }
  .item { background:#fff; color:var(--ink); border-radius:16px; padding:14px 18px; font-size:19px; text-align:left;
    display:flex; justify-content:space-between; align-items:center; box-shadow:0 3px 10px rgba(0,0,0,.08); }
  .item.sel { background:var(--pink2); color:#fff; font-weight:600; }
  .item span:first-child { min-width:0; overflow-wrap:anywhere; }
  .item .mark { font-size:22px; flex-shrink:0; margin-left:10px; }
  .custom { display:flex; gap:8px; width:100%; max-width:420px; margin-top:10px; }
  .custom input { flex:1; min-width:0; font:inherit; font-size:17px; padding:12px 16px; border-radius:999px; border:2px solid #fff; outline:none; }
  .custom input:focus { border-color:var(--pink); }
  .custom button { background:var(--pink); color:#fff; padding:0 20px; font-size:22px; }
  .cart { margin-top:22px; width:100%; max-width:420px; background:rgba(255,255,255,.7); border-radius:16px; padding:12px 16px; text-align:left; }
  .cart b { display:block; margin-bottom:6px; }
  .cart span { display:inline-block; max-width:100%; overflow-wrap:anywhere; background:#fff; border-radius:999px; padding:4px 12px; margin:3px 4px 3px 0; font-size:15px; }
  .cart .empty { opacity:.6; }
  #next1 { margin-top:18px; }

  /* final */
  #hearts { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .heart { position:absolute; bottom:-40px; font-size:28px; animation: up 4s linear forwards; }
  @keyframes up { to { transform:translateY(-110vh) rotate(20deg); opacity:0; } }
  .cat { font-size:110px; animation: kiss 1.6s ease-in-out infinite; }
  @keyframes kiss { 0%,100%{transform:scale(1) rotate(-4deg)} 50%{transform:scale(1.15) rotate(4deg)} }
  .kiss { font-size:56px; animation: pop 1.6s ease-in-out infinite; }
  @keyframes pop { 0%,100%{transform:scale(.8); opacity:.6} 50%{transform:scale(1.2); opacity:1} }
  .rosebox { width:min(88vw,360px); aspect-ratio:480/396; overflow:hidden; border-radius:22px; box-shadow:0 8px 24px rgba(0,0,0,.15); }
  .rosebox img { width:100%; display:block; }
  #sendStatus { font-size:13px; opacity:.55; margin-top:18px; }
</style>
</head>
<body>

<!-- 1: Приглашение -->
<section class="screen active" id="s1">
  <h1>Пойдёшь на свидание? 💕</h1>
  <div id="answers">
    <button class="btn" id="yes">Да</button>
    <button id="no">Нет</button>
  </div>
  <div id="reaction"></div>
</section>

<!-- 2: Выбор -->
<section class="screen" id="s2">
  <h2>Что будем делать? ✨</h2>
  <div class="tabs" id="tabs"></div>
  <div class="items" id="items"></div>
  <div class="custom"><input id="customInput" placeholder="Свой вариант…" maxlength="60"><button id="customAdd">+</button></div>
  <div class="cart" id="cart"></div>
  <button class="btn" id="next1" disabled>Далее</button>
</section>

<!-- 3: Время -->
<section class="screen" id="s3">
  <h2>Когда тебе удобно? 🗓️</h2>
  <div class="items" id="times"></div>
</section>

<!-- 4: Финал -->
<section class="screen" id="s4">
  <div class="rosebox"><img src="rose.gif" alt=""></div>
  <h1 style="margin-top:20px">Уже жду нашей встречи ❤️</h1>
  <div id="sendStatus"></div>
  <div id="hearts"></div>
</section>

<script>
/* ====== НАСТРОЙКИ TELEGRAM ======
   1) @BotFather -> /newbot -> скопируй токен сюда
   2) Напиши своему боту любое сообщение, затем открой
      https://api.telegram.org/bot<ТОКЕН>/getUpdates  и найди "chat":{"id":ЧИСЛО}  */
const BOT_TOKEN = "";
const CHAT_ID   = "";

const NAME = "Дариночка";
// Бесплатная почта: web3forms.com -> введи свой email -> ключ придёт на почту -> вставь сюда
const WEB3FORMS_KEY = "2035ee75-9558-470b-afd9-2c9fbc88dd6b";

/* ====== ДАННЫЕ ====== */
const CATEGORIES = {
  "🎬 Фильмы":        ["Оно", "Форма голоса", "До встречи с тобой", "Электроник"],
  "🎲 Настолки":      ["Шахматы", "Шашки", "Пазлы"],
  "📝 Опросники":     ["Какой ты персонаж?", "Насколько мы совместимы?", "20 вопросов друг другу", "Что у нас общего?"],
};
const TIMES = [
  "Понедельник, день, 17:00",
  "Понедельник, вечер, 18:30",
  "Среда, день, 17:00",
  "Среда, вечер, 20:00",
  "Четверг, день, 17:00",
  "Четверг, вечер, 20:00",
  "Пятница, день, 17:00",
  "Пятница, вечер, 20:30",
  "Суббота, вечер, 20:00",
  "Воскресенье, день, 17:00",
  "Воскресенье, вечер, 20:00",
];

const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll(".screen").forEach(s => s.classList.remove("active")); $(id).classList.add("active"); };

/* ====== ЭКРАН 1 ====== */
const noSteps = [
  { emo:"😢", txt:`Ну почему, ${NAME}…` },
  { emo:"🥺", txt:"Ну пожалуйста…" },
  { emo:"🧎", txt:"Умоляю!" },
];
let noCount = 0;
$("no").addEventListener("click", () => {
  if (noCount < noSteps.length) {
    const s = noSteps[noCount];
    $("reaction").innerHTML = `<div class="emo">${s.emo}</div><div class="txt">${s.txt}</div>`;
  }
  noCount++;
  const yesScale = 1 + noCount * 0.45, noScale = Math.max(0.25, 1 - noCount * 0.25);
  $("yes").style.transform = `scale(${yesScale})`;
  $("yes").style.margin = `0 ${noCount * 18}px`;
  $("no").style.transform = `scale(${noScale})`;
  $("no").style.opacity = Math.max(0.35, 1 - noCount * 0.2);
  if (noCount > noSteps.length) {           // ещё раз — «Да» закрывает всё
    $("yes").style.transform = "";
    $("yes").classList.add("cover");
    $("no").classList.add("gone");
  }
});
$("yes").addEventListener("click", () => {
  $("yes").classList.remove("cover");
  show("s2");
});

/* ====== ЭКРАН 2 ====== */
const cart = new Set();
let currentCat = Object.keys(CATEGORIES)[0];
const extra = {}; // свои варианты по категориям
Object.keys(CATEGORIES).forEach(c => extra[c] = []);

function labelOf(cat, item) { return `${cat.split(" ")[0]} ${item}`; }

function renderTabs() {
  $("tabs").innerHTML = "";
  Object.keys(CATEGORIES).forEach(c => {
    const b = document.createElement("button");
    b.className = "tab" + (c === currentCat ? " on" : "");
    b.textContent = c;
    b.onclick = () => { currentCat = c; renderTabs(); renderItems(); };
    $("tabs").appendChild(b);
  });
}
function renderItems() {
  $("items").innerHTML = "";
  [...CATEGORIES[currentCat], ...extra[currentCat]].forEach(it => {
    const key = labelOf(currentCat, it);
    const b = document.createElement("button");
    b.className = "item" + (cart.has(key) ? " sel" : "");
    b.innerHTML = `<span>${it}</span><span class="mark">${cart.has(key) ? "✓" : "＋"}</span>`;
    b.onclick = () => { cart.has(key) ? cart.delete(key) : cart.add(key); renderItems(); renderCart(); };
    $("items").appendChild(b);
  });
}
function renderCart() {
  $("cart").innerHTML = cart.size
    ? `<b>Твой выбор:</b>` + [...cart].map(x => `<span>${esc(x)}</span>`).join("")
    : `<b>Твой выбор</b><div class="empty">Пока пусто — выбери что нравится</div>`;
  $("next1").disabled = cart.size === 0;
}
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function addCustom() {
  const v = $("customInput").value.trim();
  if (!v) return;
  extra[currentCat].push(v);
  cart.add(labelOf(currentCat, v));
  $("customInput").value = "";
  renderItems(); renderCart();
}
$("customAdd").onclick = addCustom;
$("customInput").addEventListener("keydown", e => { if (e.key === "Enter") addCustom(); });
$("next1").onclick = () => show("s3");

/* ====== ЭКРАН 3 ====== */
TIMES.forEach(t => {
  const b = document.createElement("button");
  b.className = "item";
  b.innerHTML = `<span>${t}</span><span class="mark">💞</span>`;
  b.onclick = () => finish(t);
  $("times").appendChild(b);
});

/* ====== ФИНАЛ ====== */
let sent = false;
function finish(time) {
  if (sent) return; sent = true;
  show("s4");
  const heartTimer = setInterval(spawnHeart, 250);
  setTimeout(() => clearInterval(heartTimer), 20000);
  const text = `💌 ${NAME} согласилась на свидание!\n\nВыбрала:\n` +
    [...cart].map(x => "• " + x).join("\n") + `\n\n🕒 Когда: ${time}`;
  sendTG(text);
  sendEmail(text);
}
async function sendEmail(text) {
  if (!WEB3FORMS_KEY) { console.log("Почта не настроена"); return; }
  try {
    const r = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ access_key: WEB3FORMS_KEY, subject: `${NAME} ответила на приглашение 💌`, message: text })
    });
    if (!r.ok) throw new Error(r.status);
  } catch (e) { console.error("Не удалось отправить на почту", e); }
}
function spawnHeart() {
  const h = document.createElement("div");
  h.className = "heart";
  h.textContent = ["❤️","💖","💕","💗"][Math.floor(Math.random()*4)];
  h.style.left = Math.random() * 100 + "vw";
  $("hearts").appendChild(h);
  setTimeout(() => h.remove(), 4000);
}
async function sendTG(text) {
  if (!BOT_TOKEN || !CHAT_ID) { console.log("Telegram не настроен. Сообщение:\n" + text); return; }
  try {
    const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: CHAT_ID, text })
    });
    if (!r.ok) throw new Error(r.status);
  } catch (e) { console.error("Не удалось отправить в Telegram", e); }
}

renderTabs(); renderItems(); renderCart();
</script>
</body>
</html>
